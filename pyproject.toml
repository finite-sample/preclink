[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tether"
dynamic = ["version"]
description = "High-precision record linkage library with multi-pass support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "record-linkage",
    "entity-resolution",
    "data-matching",
    "deduplication",
    "fuzzy-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0.0",
    "rapidfuzz>=3.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.0.0",
    "ruff>=0.3.0",
    "vulture>=2.10",
    "pydoclint>=0.4.0",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2024.1.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/finite-sample/tether"
Documentation = "https://tether.readthedocs.io"
Repository = "https://github.com/finite-sample/tether"
Issues = "https://github.com/finite-sample/tether/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "tether/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["tether"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tether"]
exclude = ["tether/_version.py"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "D100",
    "D104",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=tether --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["tether"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.vulture]
min_confidence = 80
paths = ["tether"]

[tool.pydoclint]
style = "google"
check-return-types = false
check-yield-types = false
arg-type-hints-in-docstring = false
skip-checking-raises = true
allow-init-docstring = true
check-class-attributes = false
