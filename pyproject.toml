[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "preclink"
version = "1.2.0"
description = "High-precision record linkage library with multi-pass support"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "record-linkage",
    "entity-resolution",
    "data-matching",
    "deduplication",
    "fuzzy-matching",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0.0",
    "rapidfuzz>=3.0.0",
    "scipy>=1.11.0",
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/finite-sample/preclink"
Documentation = "https://finite-sample.github.io/preclink"
Repository = "https://github.com/finite-sample/preclink"
Issues = "https://github.com/finite-sample/preclink/issues"

[tool.uv.build-backend]
module-name = "preclink"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6.100.0",
    # test_realistic_data builds its evaluation fixtures with sklearn.
    "scikit-learn>=1.4.0",
]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF", "ANN",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs. D100/D104/D107: module, package and __init__
# docstrings are covered by the class docstring in this codebase.
ignore = ["D203", "D213", "W191", "D206", "D300", "D100", "D104", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
# S311: the synthetic record fixtures seed `random` for reproducibility; there
# is nothing cryptographic about generated names and addresses.
"tests/**" = ["S101", "D", "ARG", "SLF", "ANN", "S311"]
"docs/**" = ["D"]
# Benchmarks are scripts: they print their results and seed with `random`.
"examples/**" = ["D", "ANN", "T20", "S311"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
skip-checking-raises = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.preen]
